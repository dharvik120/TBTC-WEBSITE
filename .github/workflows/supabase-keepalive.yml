name: Supabase 24x7 Keep-Alive

on:
  schedule:
    # Runs every 2 days at midnight UTC to prevent Supabase inactivity pausing
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database / Health Check
        run: |
          echo "Supabase keep-alive cron running..."
          # If a live domain or health endpoint is provided, ping it
          curl -s -f "https://www.stbtcgi.com/api/health" || echo "Website domain health endpoint ping attempted"

